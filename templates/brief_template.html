<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{HEADLINE}} · 早晨簡報</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --base-font-size: 16px;
  --bg-top: #F9F9F7;
  --bg-bottom: #FCFCFB;
  --text-main: #2E2C27;
  --text-sub: #6B6A63;
  --border-color: #E4E3DC;
  --accent-color: #C6613F;
}

html { font-size: var(--base-font-size); }

body {
  font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg-bottom);
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
}

.band { width: 100%; }
.band-top { background: var(--bg-top); border-bottom: 1px solid #E1E1DF; }
.band-bottom { background: var(--bg-bottom); }

.inner {
  max-width: 1140px;
  margin: 0 auto;
  padding: 48px 40px;
}

.band-top .inner { padding: 48px 40px 36px; }

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 12px;
}

.nav-home {
  font-size: 0.875rem;
  color: var(--text-sub);
  text-decoration: none;
  font-weight: 500;
}
.nav-home:hover { color: var(--accent-color); }

.controls-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.control-btn-group {
  display: inline-flex;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  overflow: hidden;
  background: #FFFFFF;
}

.btn-ctrl {
  background: transparent;
  border: none;
  padding: 6px 14px;
  font-size: 0.8125rem;
  color: var(--text-sub);
  cursor: pointer;
  border-right: 1px solid var(--border-color);
  transition: all 0.2s ease;
}
.btn-ctrl:last-child { border-right: none; }
.btn-ctrl:hover, .btn-ctrl.active {
  background: #F0EFEA;
  color: var(--text-main);
  font-weight: 600;
}

.day-date {
  color: var(--text-sub);
  font-size: 0.875rem;
  letter-spacing: 0.02em;
  margin-bottom: 12px;
}

.headline {
  font-family: "Noto Serif TC", "PMingLiU", "Songti TC", Georgia, serif;
  font-weight: 600;
  font-size: 2.25rem;
  line-height: 1.35;
  color: var(--text-main);
  max-width: 960px;
  margin-bottom: 28px;
}

/* 每日格言區塊 */
.quote-card {
  background: #FFFFFF;
  border: 1px solid var(--border-color);
  border-left: 4px solid var(--accent-color);
  border-radius: 6px;
  padding: 22px 28px;
  margin-bottom: 20px;
}

.quote-title {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent-color);
  margin-bottom: 10px;
}

.quote-text-en {
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 1.0625rem;
  color: var(--text-main);
  margin-bottom: 6px;
  line-height: 1.5;
}

.quote-text-zh {
  font-size: 0.9375rem;
  color: var(--text-sub);
  margin-bottom: 8px;
}

.quote-author {
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text-main);
  text-align: right;
}

/* 「一句話快訊」區塊 */
.flash-card {
  background: #FFFFFF;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 20px 26px;
  margin-bottom: 8px;
}

.flash-header {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8125rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-main);
  margin-bottom: 12px;
}

.flash-badge {
  background: var(--accent-color);
  color: #FFFFFF;
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
}

.flash-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.flash-item {
  position: relative;
  padding-left: 20px;
  margin-bottom: 8px;
  font-size: 0.9375rem;
  color: var(--text-main);
  line-height: 1.55;
}
.flash-item:last-child { margin-bottom: 0; }

.flash-item::before {
  content: "⚡";
  position: absolute;
  left: 0;
  top: 1px;
  font-size: 0.8125rem;
}

.section-heading {
  font-size: 0.875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-main);
  margin-bottom: 24px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--text-main);
}

.list-block { margin-bottom: 48px; }
.list-block:last-child { margin-bottom: 0; }

.item-grid {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.item {
  display: flex;
  gap: 20px;
  padding: 20px 24px;
  background: #FFFFFF;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  transition: border-color 0.2s ease;
}

.item:hover { border-color: #B4B3A8; }

.item-num {
  font-size: 1.125rem;
  font-weight: 700;
  color: var(--accent-color);
  font-variant-numeric: tabular-nums;
  min-width: 24px;
  padding-top: 2px;
}

.item-body { flex: 1; }

.item-title {
  font-weight: 700;
  font-size: 1.0625rem;
  color: var(--text-main);
  margin-bottom: 8px;
}

.item-title a, .item-sentence a, .item-sentence-en a {
  color: inherit;
  text-decoration: underline;
  text-decoration-color: #B4B3A8;
  text-underline-offset: 3px;
}
.item-title a:hover { color: var(--accent-color); }

.item-image {
  width: 100%;
  max-height: 240px;
  object-fit: cover;
  border-radius: 6px;
  margin-bottom: 12px;
  border: 1px solid var(--border-color);
  background: var(--bg-top);
}

.item-sentence {
  font-size: 0.9375rem;
  line-height: 1.6;
  color: var(--text-sub);
  margin-bottom: 4px;
}

.item-sentence-en {
  font-size: 0.875rem;
  line-height: 1.55;
  color: #7B7973;
}

.item-sentence .src, .item-sentence-en .src {
  text-decoration: underline;
  text-decoration-color: #B4B3A8;
  text-underline-offset: 3px;
  color: var(--text-sub);
}

.calm-line {
  font-size: 0.9375rem;
  color: var(--text-sub);
  padding: 8px 0 0;
}

/* 頁尾中元資料與生成資訊欄位 (Timestamp & LLM Model) */
.page-footer {
  margin-top: 56px;
  padding-top: 24px;
  border-top: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 0.8125rem;
  color: var(--text-sub);
}

.meta-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.meta-pill {
  background: #F0EFEA;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 500;
  color: var(--text-main);
}

body.lang-zh-mode .lang-en-only { display: none !important; }
body.lang-en-mode .lang-zh-only { display: none !important; }

@media (max-width: 768px) {
  .headline { font-size: 1.625rem; }
  .inner { padding: 32px 20px; }
  .band-top .inner { padding: 32px 20px 24px; }
  .toolbar { flex-direction: column; align-items: flex-start; }
  .item { padding: 16px; }
  .page-footer { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body class="lang-both-mode">

<div class="band band-top">
  <div class="inner">

    <div class="toolbar">
      <a href="../index.html" class="nav-home">← 返回日報歸檔總覽頁面</a>
      <div class="controls-group">
        <div class="control-btn-group">
          <button class="btn-ctrl" onclick="changeFontSize(-1)" title="縮小字體">A-</button>
          <button class="btn-ctrl" onclick="resetFontSize()" title="重置字體">標準</button>
          <button class="btn-ctrl" onclick="changeFontSize(1)" title="放大字體">A+</button>
        </div>
        <div class="control-btn-group">
          <button class="btn-ctrl active" id="btn-lang-both" onclick="setLanguage('both')">中英</button>
          <button class="btn-ctrl" id="btn-lang-zh" onclick="setLanguage('zh')">繁中</button>
          <button class="btn-ctrl" id="btn-lang-en" onclick="setLanguage('en')">EN</button>
        </div>
      </div>
    </div>

    <div class="day-date">{{DATE_STRING}}</div>
    <div class="headline">{{HEADLINE}}</div>

    <!-- 💡 每日格言 -->
    <div class="quote-card">
      <div class="quote-title">💡 每日格言 · Daily Insight</div>
      <div class="quote-text-en lang-en-only">{{QUOTE_EN}}</div>
      <div class="quote-text-zh lang-zh-only">{{QUOTE_ZH}}</div>
      <div class="quote-author">— {{QUOTE_AUTHOR}}</div>
    </div>

    <!-- ⚡ 今日重點速覽（一句話快訊） -->
    <div class="flash-card">
      <div class="flash-header">
        <span>⚡ 今日重點速覽 · Daily Flash Takeaways</span>
        <span class="flash-badge">30秒速讀</span>
      </div>
      <ul class="flash-list">
        {{FLASH_NEWS_ITEMS}}
      </ul>
    </div>

  </div>
</div>

<div class="band band-bottom">
  <div class="inner">
    <div class="calm-line">{{CALM_LINE}}</div>
    {{CONTENT_SECTIONS}}

    <!-- 頁尾生成資訊欄位 (模型與時間戳記) -->
    <footer class="page-footer">
      <div class="meta-item">
        <span>🤖 生成模型：</span>
        <span class="meta-pill">{{GENERATED_MODEL}}</span>
      </div>
      <div class="meta-item">
        <span>⏱️ 生成時間戳記：</span>
        <span class="meta-pill">{{GENERATION_TIMESTAMP}}</span>
      </div>
    </footer>

  </div>
</div>

<script>
let currentFontSize = parseInt(localStorage.getItem('brief_font_size')) || 16;
applyFontSize(currentFontSize);

function changeFontSize(delta) {
  currentFontSize = Math.min(Math.max(currentFontSize + delta * 2, 14), 26);
  localStorage.setItem('brief_font_size', currentFontSize);
  applyFontSize(currentFontSize);
}

function resetFontSize() {
  currentFontSize = 16;
  localStorage.setItem('brief_font_size', currentFontSize);
  applyFontSize(currentFontSize);
}

function applyFontSize(size) {
  document.documentElement.style.setProperty('--base-font-size', size + 'px');
}

let currentLang = localStorage.getItem('brief_lang') || 'both';
setLanguage(currentLang);

function setLanguage(mode) {
  document.body.classList.remove('lang-both-mode', 'lang-zh-mode', 'lang-en-mode');
  document.body.classList.add('lang-' + mode + '-mode');
  
  document.querySelectorAll('.controls-group .btn-ctrl').forEach(b => b.classList.remove('active'));
  const activeBtn = document.getElementById('btn-lang-' + mode);
  if (activeBtn) activeBtn.classList.add('active');
  
  localStorage.setItem('brief_lang', mode);
}
</script>

</body>
</html>
